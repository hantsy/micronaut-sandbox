name: data-mongo-test-resources

on:
  push:
    paths:
      - "data-mongo-test-resources/**"
    branches:
      - master
  pull_request:
    paths:
      - "data-mongo-test-resources/**"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Execute Gradle build
        run: |
          cd data-mongo-test-resources
          chmod +x gradlew
          ./gradlew build
