# "mock" environment for controller tests with @MockBean on the repository.
# The global key jpa.enabled=false disables JPA bootstrapping so Hibernate Reactive
# does not open a database connection while building the SessionFactory.
# The per-config key jpa.default.enabled=false is ignored on the reactive path
# (micronaut-projects/micronaut-sql#2168), so the global key is required here.
jpa.enabled=false
jpa.default.properties.hibernate.connection.url=jdbc:postgresql://localhost:1/probe
jpa.default.properties.hibernate.hbm2ddl.auto=none
