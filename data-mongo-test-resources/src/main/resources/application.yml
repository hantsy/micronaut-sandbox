micronaut:
  application:
    name: demo
  server:
    port: 8080
  data:
    mongodb:
      create-collections: true

# `mongodb.uri` is resolved by the Micronaut Test Resources plugin
# (see `testResourcesService("io.micronaut.testresources:micronaut-test-resources-mongodb")`).
# For local (non-test) runs, set MONGO_HOST/MONGO_PORT env vars or provide the URI here.
# mongodb:
#   uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/mydb

netty:
  default:
    allocator:
      max-order: 3
