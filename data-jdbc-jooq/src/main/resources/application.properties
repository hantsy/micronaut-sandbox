micronaut.application.name=demo

datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver

flyway.datasources.default.enabled=true

docker.check.timeout.seconds=300

# MN5 Jackson 3 defaults serialization-inclusion to NON_EMPTY: empty collections are
# omitted in JSON (round-trip as null). Set explicitly to document the behavior.
jackson.serialization-inclusion=NON_EMPTY
